name: Apply manual team QR payment
on:
  push:
    paths-ignore:
      - '.github/workflows/**'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: python
        env:
          ROUTE_B64:  b2s9RmFsc2UsZXJyb3I9J1BsZWFzZSBjb21wbGV0ZSBhbGwgcmVnaXN0cmF0aW9uIGZpZWxkcy4nKSx400QKICAgIGlmIG5vdCBpbWFnZSBvciBub3QgaW1hZ2UuZmlsZW5hbWUgb3I gUGF0aChoYWdlKS5zdWZmaXgubG93ZXIoKSBub3QgaW4geycuanBnJywnLmpwZWcnLCcucG5nJ306IHJldHVybiBqc29uaWZ5KG9rPUZhbHNlLGVycm9yPSdQbGVhc2UgdXBsb2FkIGEgSlBHIG9yIFBORyBwYXltZW50IHNjcmVlbnNob3QuJyl8A==
          HTML_B64: REPLACE_WITH_GENERATED_HTML_BASE64
        run: |
          import os,base64
          from pathlib import Path
          app=Path('app.py'); s=app.read_text()
          route=base64.b64decode(os.environ['ROUTE_B64']).decode()
          if 'def team_interest_manual_submit' not in s:
              app.write_text(s+route)
          Path('templates/team_registration.html').write_text(base64.b64decode(os.environ['HTML_B64']).decode())
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py templates/team_registration.html
          git diff --cached --quiet || git commit -m 'Switch team registration to manual QR payment'
          git push